# Inventario de permisos de Haberes — FUENTE DE VERDAD.
#
# Se sincroniza contra la tabla `permiso` de `haberes` al arrancar haberes-core
# (app.seguridad.manifest-sync.enabled) y también a demanda desde
# POST /api/haberes/core/permiso/sync.
#
# Reglas:
#  - La identidad de una clave es (aplicacion, clave).
#  - Si una clave está acá y no en la base, se crea.
#  - Si está en ambos, se actualizan descripcion, modulo y activo.
#  - Si existe en la base y NO está acá, se retira con activo = false (nunca se borra).
#  - Para agregar una funcionalidad: agregá la clave acá en el mismo cambio en que
#    se cablea en el código (guard, menú, directiva o @RequierePermiso).
version: 1

